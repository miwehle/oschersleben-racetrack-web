name: Publish simulation

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "design/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      experimental_artifact_url:
        description: Temporary download URL of the tested experimental web ZIP
        type: string
        default: ''

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/configure-pages@v5

      - name: Include design previews
        run: cp -R design site/design

      - name: Include experimental build artifact
        if: inputs.experimental_artifact_url != ''
        env:
          ARTIFACT_URL: ${{ inputs.experimental_artifact_url }}
        run: |
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o /tmp/experimental.zip
          rm -rf site/experimental
          mkdir -p site/experimental
          unzip -q /tmp/experimental.zip -d site/experimental
          test -f site/experimental/index.html

      - name: Check Pages site size
        run: |
          bytes=$(du --bytes --summarize site | cut -f1)
          echo "Pages site: $bytes bytes" >> "$GITHUB_STEP_SUMMARY"
          test "$bytes" -le 1000000000 || { echo 'Pages site exceeds 1 GB'; exit 1; }

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$count" = 1 ]; then exit 0; fi
            sleep 5
          done
          echo "Pages artifact metadata not ready"; exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
