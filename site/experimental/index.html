  let result = null, loaderHidden = false, hidden = document.hidden;
  const visibility = () => { hidden = hidden || document.hidden; };
  document.addEventListener('visibilitychange', visibility);
  const round = n => Number.isFinite(n) ? Math.round(n * 100) / 100 : null;
  function delivery(r) {
    // Service-worker timings do not reveal where its response came from.
    if (!r || r.workerStart > 0 || !(r.responseEnd > 0) ||
        !(r.encodedBodySize > 0) || !Number.isFinite(r.transferSize) || r.transferSize < 0) return 'unknown';

    if (r.deliveryType === 'cache' || r.transferSize < r.encodedBodySize) return 'revalidated';

  function ready() {
    if (result || !loaderHidden || marks.scene_ready_ms === null) return;
    marks.ready_ms = p.now();
    document.removeEventListener('visibilitychange', visibility);
    const nav = p.getEntriesByType('navigation')[0];
    // Resource timings can overlap compilation. These are milestones, not additive CPU phases.
    const resources = p.getEntriesByType('resource').filter(r => r.startTime <= marks.ready_ms &&
      /\.(wasm|pck|js|png)(?:[?#]|$)/.test(r.name) && new URL(r.name, location.href).origin === location.origin);

    const sum = field => entries.length && entries.every(e => Number.isFinite(e[field]))

    const assets = resources.filter(r => /\.(wasm|pck)(?:[?#]|$)/.test(r.name));
    const wasm = resources.filter(r => /\.wasm(?:[?#]|$)/.test(r.name));

      const matches = resources.filter(r => new URL(r.name).pathname === stem + '.' + ext);

    const cache = types.includes('unknown') ? 'unknown' :
      types.every(t => t === 'network') ? 'network' : types.includes('network') ? 'mixed' :
      types.includes('revalidated') ? 'revalidated' : 'cache';

      schema: 1, page_start_id: String(p.timeOrigin) + '-' + Math.random().toString(36).slice(2),
      utc: Date.now(), total_ms: round(marks.ready_ms),
      milestones_ms: Object.fromEntries(Object.entries(marks).map(([key, value]) => [key, round(value)])),
      assets_finished_ms: assets.length ? round(Math.max(...assets.map(r => r.responseEnd))) : null,

    engineStart() { if (marks.engine_start_ms === null) marks.engine_start_ms = p.now(); },
    sceneReady() { if (marks.scene_ready_ms === null) marks.scene_ready_ms = p.now(); ready(); },
    loaderReady() { loaderHidden = true; ready(); },
    snapshot() { return result ? JSON.parse(JSON.stringify(result)) : null; }
  };
})();

	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
